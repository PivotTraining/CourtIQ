name: One-time CourtIQ lockfile refresh for patched dependencies

on:
  push:
    branches:
      - security/repair-npm-audit-20261122

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Regenerate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install and validate patched dependencies
        run: npm ci --no-fund
      - name: Audit patched dependencies
        run: npm audit --audit-level=moderate
      - name: Lint and test
        run: npm run lint && npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: courtiq-ci-placeholder-key
      - name: Commit validated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock patched npm dependency tree after audit and tests"
            git push
          fi
